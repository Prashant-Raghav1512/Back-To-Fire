name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Neon connection string, used only at build time by
          # scripts/fetch-content.mjs to refresh src/data/*.json. Never
          # shipped to the browser. Set as a repository secret (Settings ->
          # Secrets and variables -> Actions -> Secrets).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Neon connection string used directly from the browser by the
          # contact form. Deliberately baked into the public JS bundle —
          # see src/lib/contact.ts for why.
          VITE_NEON_CONTACT_URL: ${{ secrets.VITE_NEON_CONTACT_URL }}
          # URL of the Groq proxy Cloudflare Worker (cloudflare-worker/) that
          # both the chatbot (src/lib/groqChat.ts) and the Tools page's
          # protein estimator (proteinChat.ts) call — NOT a secret itself,
          # the actual Groq keys live server-side as the Worker's own
          # secrets (see cloudflare-worker/README.md). This var only exists
          # after that Worker has been deployed at least once.
          VITE_GROQ_PROXY_URL: ${{ secrets.VITE_GROQ_PROXY_URL }}
          # Note: the Articles page's translator (src/lib/articleTranslate.ts)
          # needs no key of its own — it calls Google Translate's free
          # endpoint directly and caches results via VITE_NEON_CONTACT_URL
          # above.
          # Clerk publishable key powering sign-in/sign-up. Public by
          # design — see src/main.tsx.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

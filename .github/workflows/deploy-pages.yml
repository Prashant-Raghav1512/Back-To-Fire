name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Neon connection string, used only at build time by
          # scripts/fetch-content.mjs to refresh src/data/*.json. Never
          # shipped to the browser. Set as a repository secret (Settings ->
          # Secrets and variables -> Actions -> Secrets).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # URL of the data API Cloudflare Worker that every browser-side
          # Neon call (contact form, enrollments, membership, Community,
          # friends, DMs, translation cache) now goes through instead of
          # connecting to Neon directly. Not a secret itself (just an
          # endpoint address) — the real Neon credential and Clerk secret
          # key live server-side as Worker secrets. See cloudflare-worker-data/.
          VITE_DATA_API_URL: ${{ secrets.VITE_DATA_API_URL }}
          # URL of the Cloudflare Worker that proxies both Groq-backed chat
          # features (main chatbot + Tools page protein estimator). Not a
          # secret itself (just an endpoint address) — the real Groq keys
          # live server-side as Worker secrets now. See cloudflare-worker/.
          VITE_GROQ_PROXY_URL: ${{ secrets.VITE_GROQ_PROXY_URL }}
          # Note: the Articles page's translator (src/lib/articleTranslate.ts)
          # needs no key of its own — it calls Google Translate's free
          # endpoint directly and caches results via VITE_DATA_API_URL
          # above.
          # Clerk publishable key powering sign-in/sign-up. Public by
          # design — see src/main.tsx.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
